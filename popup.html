<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Sentinel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        <h1>Link Sentinel</h1>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" title="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
        <button id="historyBtn" class="icon-btn" title="Scan history">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12,6 12,12 16,14"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="scan-controls">
      <div class="speed-selector">
        <label for="speed">Speed:</label>
        <select id="speed">
          <option value="fast">Fast (5 concurrent)</option>
          <option value="moderate" selected>Moderate (10 concurrent)</option>
          <option value="slow">Slow (20 concurrent)</option>
        </select>
      </div>
      <div class="button-group">
        <button id="scanCurrentBtn" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
          Scan Current Page
        </button>
        <button id="scanAllBtn" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          Scan All Tabs
        </button>
      </div>
    </div>

    <div id="progressSection" class="progress-section hidden">
      <div class="progress-info">
        <span id="progressText">Scanning...</span>
        <span id="progressCount">0/0</span>
      </div>
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <button id="stopBtn" class="btn btn-danger btn-small">Stop</button>
    </div>

    <div id="resultsSection" class="results-section hidden">
      <div class="results-header">
        <div class="stats">
          <span class="stat" id="totalLinks">0 links</span>
          <span class="stat stat-broken" id="brokenLinks">0 broken</span>
          <span class="stat stat-ok" id="okLinks">0 OK</span>
          <span class="stat stat-redirect" id="redirectLinks">0 redirects</span>
        </div>
        <div class="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="broken">Broken</button>
          <button class="filter-btn" data-filter="redirect">Redirects</button>
          <button class="filter-btn" data-filter="ok">OK</button>
        </div>
        <button id="exportBtn" class="btn btn-outline btn-small">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7,10 12,15 17,10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Export CSV
        </button>
      </div>
      <div class="results-table-container">
        <table class="results-table">
          <thead>
            <tr>
              <th>URL</th>
              <th>Status</th>
              <th>Type</th>
              <th>HTTP Code</th>
            </tr>
          </thead>
          <tbody id="resultsBody">
          </tbody>
        </table>
      </div>
    </div>

    <div id="historySection" class="history-section hidden">
      <div class="history-header">
        <h2>Scan History</h2>
        <div class="history-actions">
          <button id="clearHistoryBtn" class="btn btn-outline btn-small">Clear History</button>
          <button id="backBtn" class="btn btn-outline btn-small">Back</button>
        </div>
      </div>
      <div id="historyList" class="history-list">
      </div>
    </div>

    <div id="emptyState" class="empty-state">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      <p>Click "Scan Current Page" to check for broken links</p>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="scanner.js"></script>
  <script src="popup.js"></script>
</body>
</html>
